buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Values are read outside of the task actions, otherwise the configuration cache
    // cannot serialize them (the closures would capture the Project instance)
    def forceRebuild = project.hasProperty("forceRebuild")
    def cxxDirectory = new File(projectDir, ".cxx")
    tasks.matching { it.name.contains("assemble") }.configureEach { task ->
        task.outputs.upToDateWhen { !forceRebuild }

        // Remove empty folders left by externalNativeBuild (previously done in
        // gradle.buildFinished, which is incompatible with the configuration cache)
        task.doLast {
            if (cxxDirectory.directory) {
                def emptyDirectories = []
                cxxDirectory.eachDirRecurse { dir ->
                    if (dir.listFiles()?.length == 0) emptyDirectories << dir
                }
                emptyDirectories.reverseEach { dir -> dir.delete() }
            }
        }
    }

    tasks.matching {
        it.name in ["mergeDebugNativeLibs", "stripDebugDebugSymbols", "packageDebug"]
    }.configureEach { task ->
        task.outputs.cacheIf { true }
    }
}

ext {
    ABI_FILTER = 'arm64-v8a'  // 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
    GLES_PROFILE = 'GLES3'    // 'GLES2', 'GLES3'
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
