apply plugin: 'com.android.application'
def ABI_FILTER = rootProject.ext.ABI_FILTER

// The runtime resources of the demo. They are taken from the assets folder which is shared with
// the other platforms, but only the used part is staged here and packed into the APK
def DemoAssetsDir = "$buildDir/demoAssets"
def StageDemoAssetsTask = tasks.register('stageDemoAssets', Sync) {
    from('../../assets') {
        include 'shaders/**'
        include 'models/Sponza/**'
        include 'skyboxes/sunset.png'
        include 'skyboxes/sunset.ibl.rseq'
    }
    into DemoAssetsDir
}

// Release signing is optional: set the following keys in local.properties (paths may be
// absolute or relative to this module) or provide them as environment variables.
// The keystore only has to be created once, for example:
//   keytool -genkeypair -v -keystore osgverse-release.jks -alias osgverse \
//           -keyalg RSA -keysize 2048 -validity 10000
//   (then add release.storeFile/release.storePassword/release.keyAlias/release.keyPassword)
// Without them, release builds produce an unsigned APK instead of failing.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def releaseStoreFile = localProperties.getProperty('release.storeFile') ?: System.getenv('RELEASE_STORE_FILE')
def releaseStorePassword = localProperties.getProperty('release.storePassword') ?: System.getenv('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = localProperties.getProperty('release.keyAlias') ?: System.getenv('RELEASE_KEY_ALIAS')
def releaseKeyPassword = localProperties.getProperty('release.keyPassword') ?: System.getenv('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    compileSdk = gradle.sdkVersion
    if (gradle.ndkPath) ndkPath = gradle.ndkPath
    defaultConfig {
        applicationId = 'com.osgverse.demoapp'
        minSdk gradle.minSdkVersion
        targetSdk gradle.targetSdkVersion
        ndk { abiFilters ABI_FILTER }

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions"
                abiFilters ABI_FILTER
            }
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword

                // Optional, specify signing versions used
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
            minifyEnabled = false
            proguardFiles.add(file('proguard-rules.txt'))
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    sourceSets {
        main {
            // The Java classes of SDL (org.libsdl.app.*) are taken from the SDL2 source tree
            // that also provides the headers and libSDL2.so used by the native build, so the
            // Java and native parts of SDL can never get out of sync
            java.srcDirs += '../../../SDL2/android-project/app/src/main/java'

            // The runtime resources are shared with the other platforms. Only the part which
            // this demo uses is packed into the APK (it is unpacked on the first start, see
            // AssetExtractor.java), which is why the assets are staged by a separate task:
            // the asset merging of AGP does not apply the include filter of a source set
            assets.srcDirs += DemoAssetsDir
        }
        debug {
            jniLibs.srcDirs += '../../build/sdl2_android/lib/Debug'
        }
        release {
            jniLibs.srcDirs += '../../build/sdl2_android/lib/Release'
        }
    }
    externalNativeBuild {
        cmake {
            path "../main/CMakeLists.txt"
        }
    }
}

preBuild.dependsOn ":sdl2:build", ":osgverse:build"

// The libraries of osgVerse are linked into the bridge library with "-l" flags, so the native
// build system does not know them as dependencies: it considers the bridge library up to date
// after they have changed and the APK would silently keep an old version of osgVerse. The
// bridge library is therefore removed before the native build, which forces the link step to
// run with the current libraries. The libraries have to be complete at that moment too, or the
// linker could read half written files, so the native build waits for the module building them
def BridgeLibraryDirs = [file("$buildDir/intermediates/cmake"), file("$buildDir/intermediates/cxx")]
tasks.matching { it.name.startsWith('buildCMake') && it.name.contains('[') }
        .configureEach { nativeBuildTask ->
    // The build task of one ABI, which is the one invoking the build system of the bridge
    // library (the tasks without an ABI in their name only group those)
    def abiName = nativeBuildTask.name.substring(nativeBuildTask.name.indexOf('[') + 1,
                                                nativeBuildTask.name.length() - 1)
    nativeBuildTask.dependsOn ':osgverse:build'
    nativeBuildTask.doFirst {
        BridgeLibraryDirs.each { dir ->
            if (!dir.exists()) return
            dir.eachFileRecurse { file ->
                if (file.name == 'libosgVerseAndroid.so' && file.parentFile.name == abiName)
                    file.delete()
            }
        }
    }
}

// The assets have to be staged before they are merged into the APK
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn StageDemoAssetsTask
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.so'])
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.android.support:appcompat-v7:28.0.0'
}
